<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CyberShield Defense</title>
<style>
/* ── Reset & Base ────────────────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0a0e27;
  color: #e0e6ff;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  height: 100vh;
  width: 100vw;
}

/* ── Animated Background ─────────────────────────────────────────────── */
.bg-grid {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridScroll 20s linear infinite;
  pointer-events: none; z-index: 0;
}
@keyframes gridScroll {
  to { background-position: 40px 40px; }
}

/* ── Screens ─────────────────────────────────────────────────────────── */
.screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: none; flex-direction: column; align-items: center;
  justify-content: center; z-index: 10; padding: 20px;
}
.screen.active { display: flex; }

/* ── Splash / Loading Screen ─────────────────────────────────────────── */
#splash-screen {
  background: radial-gradient(ellipse at center, #0f1538 0%, #0a0e27 70%);
}
.splash-logo {
  width: 120px; height: 120px; margin-bottom: 24px;
  background: linear-gradient(135deg, #00ff88, #00aaff);
  border-radius: 24px; display: flex; align-items: center;
  justify-content: center; font-size: 56px;
  box-shadow: 0 0 40px rgba(0,255,136,0.3);
  animation: logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(0,255,136,0.3); }
  50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(0,255,136,0.5); }
}
.splash-title {
  font-size: 28px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(135deg, #00ff88, #00aaff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 8px;
}
.splash-subtitle {
  font-size: 14px; color: #6b7db3; margin-bottom: 32px;
}
.splash-powered {
  font-size: 12px; color: #4a5580; margin-top: 40px;
}
.btn {
  padding: 14px 40px; border: none; border-radius: 12px;
  font-size: 18px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; letter-spacing: 1px;
}
.btn-primary {
  background: linear-gradient(135deg, #00ff88, #00cc6a);
  color: #0a0e27;
  box-shadow: 0 4px 20px rgba(0,255,136,0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(0,255,136,0.6);
}
.btn-secondary {
  background: rgba(255,255,255,0.08); color: #00ff88;
  border: 1px solid rgba(0,255,136,0.3);
  padding: 10px 28px; font-size: 14px; margin-top: 12px;
}
.btn-secondary:hover {
  background: rgba(0,255,136,0.1);
}

/* ── HUD ─────────────────────────────────────────────────────────────── */
#game-screen { background: transparent; justify-content: flex-start; padding: 0; }

.hud {
  width: 100%; padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(10,14,39,0.9); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,255,136,0.15); z-index: 20;
}
.hud-section { display: flex; flex-direction: column; align-items: center; }
.hud-label { font-size: 10px; color: #4a5580; text-transform: uppercase; letter-spacing: 1px; }
.hud-value { font-size: 20px; font-weight: 800; color: #00ff88; }
.hud-value.combo { color: #ff6b6b; }

.hud-level {
  background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,170,255,0.15));
  padding: 4px 14px; border-radius: 20px;
  border: 1px solid rgba(0,255,136,0.3);
}
.hud-level .hud-value { font-size: 16px; }

/* ── Progress Bar ────────────────────────────────────────────────────── */
.progress-bar {
  width: 100%; height: 4px; background: rgba(255,255,255,0.05);
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #00ff88, #00aaff);
  transition: width 0.4s ease;
}

/* ── Game Board ──────────────────────────────────────────────────────── */
.board-container {
  flex: 1; display: flex; align-items: center; justify-content: center;
  width: 100%; position: relative;
}

canvas#gameCanvas {
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(0,255,136,0.1);
}

/* ── Bonus Banner ────────────────────────────────────────────────────── */
.bonus-banner {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(135deg, #00ff88, #00aaff);
  color: #0a0e27; padding: 16px 32px; border-radius: 16px;
  font-size: 22px; font-weight: 800; z-index: 100;
  pointer-events: none; text-align: center;
  box-shadow: 0 0 60px rgba(0,255,136,0.6);
}
.bonus-banner.show {
  animation: bonusPop 1.2s ease forwards;
}
@keyframes bonusPop {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  40% { transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
}

/* ── Game Over Screen ────────────────────────────────────────────────── */
#gameover-screen {
  background: rgba(10,14,39,0.95); backdrop-filter: blur(20px);
}
.gameover-title {
  font-size: 32px; font-weight: 800; margin-bottom: 8px;
  background: linear-gradient(135deg, #ff6b6b, #ff8e53);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.gameover-subtitle {
  font-size: 14px; color: #6b7db3; margin-bottom: 24px;
}
.score-display {
  font-size: 48px; font-weight: 800; color: #00ff88;
  margin-bottom: 4px;
}
.score-label { font-size: 12px; color: #4a5580; margin-bottom: 24px; }
.stats-row {
  display: flex; gap: 32px; margin-bottom: 32px;
}
.stat { text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; color: #00aaff; }
.stat-label { font-size: 11px; color: #4a5580; }

/* ── Cyber Tip Overlay ───────────────────────────────────────────────── */
.cyber-tip {
  position: fixed; bottom: 0; left: 0; width: 100%;
  background: linear-gradient(180deg, transparent, rgba(10,14,39,0.95));
  padding: 40px 20px 20px; text-align: center; z-index: 50;
  display: none;
}
.cyber-tip.show { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.cyber-tip-text { font-size: 13px; color: #8b9dc3; margin-bottom: 6px; }
/* ── Particles ───────────────────────────────────────────────────────── */
.particle {
  position: fixed; pointer-events: none; z-index: 200;
  border-radius: 50%; animation: particleFly 0.8s ease-out forwards;
}
@keyframes particleFly {
  to { transform: translateY(-80px) scale(0); opacity: 0; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>

<!-- ═══════════════ SPLASH SCREEN ═══════════════ -->
<div id="splash-screen" class="screen active">
  <div class="splash-logo">🛡️</div>
  <div class="splash-title">CYBERSHIELD</div>
  <div class="splash-subtitle">D E F E N S E</div>
  <button class="btn btn-primary" onclick="Game.start()">▶ PLAY</button>
  <div class="splash-powered">
    Match cybersecurity icons to neutralise threats!
  </div>
</div>

<!-- ═══════════════ GAME SCREEN ═══════════════ -->
<div id="game-screen" class="screen">
  <div class="hud">
    <div class="hud-section">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="hud-score">0</span>
    </div>
    <div class="hud-section hud-level">
      <span class="hud-label">Level</span>
      <span class="hud-value" id="hud-level">1</span>
    </div>
    <div class="hud-section">
      <span class="hud-label">Moves</span>
      <span class="hud-value" id="hud-moves">30</span>
    </div>
    <div class="hud-section">
      <span class="hud-label">Combo</span>
      <span class="hud-value combo" id="hud-combo">x1</span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="board-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div class="cyber-tip" id="cyber-tip">
    <div class="cyber-tip-text" id="cyber-tip-text"></div>
  </div>
</div>

<!-- ═══════════════ GAME OVER SCREEN ═══════════════ -->
<div id="gameover-screen" class="screen">
  <div class="gameover-title">THREAT DETECTED</div>
  <div class="gameover-subtitle">Your shields are depleted!</div>
  <div class="score-display" id="final-score">0</div>
  <div class="score-label">THREAT SCORE NEUTRALISED</div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-value" id="final-level">1</div>
      <div class="stat-label">Level</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="final-combo">1</div>
      <div class="stat-label">Best Combo</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="final-matches">0</div>
      <div class="stat-label">Matches</div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="Game.start()">🔄 PLAY AGAIN</button>
</div>

<!-- ═══════════════ BONUS BANNER ═══════════════ -->
<div class="bonus-banner" id="bonus-banner"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CyberShield Defense — Match-3 Puzzle Engine
// ═══════════════════════════════════════════════════════════════════════════

const Game = (() => {
  // ── Constants ──────────────────────────────────────────────────────────
  const COLS = 7;
  const ROWS = 8;
  const PIECE_TYPES = [
    { emoji: '🛡️', name: 'Shield',   color: '#00ff88' },
    { emoji: '🔒', name: 'Lock',     color: '#00aaff' },
    { emoji: '🔑', name: 'Key',      color: '#ffcc00' },
    { emoji: '🔥', name: 'Firewall', color: '#ff6b6b' },
    { emoji: '🐛', name: 'Bug',      color: '#ff8e53' },
    { emoji: '💀', name: 'Threat',   color: '#cc44ff' },
  ];

  const CYBER_TIPS = [
    "Use a unique password for every account",
    "Enable two-factor authentication everywhere",
    "Keep your software and OS updated",
    "Don't click suspicious links in emails",
    "Use a VPN on public Wi-Fi networks",
    "Back up your data regularly",
    "Review app permissions on your phone",
    "Use a password manager for security",
    "Be cautious of phishing attempts",
    "Encrypt sensitive files before sharing",
    "Monitor your accounts for unusual activity",
    "Secure your home router with a strong password",
  ];

  // ── State ──────────────────────────────────────────────────────────────
  let canvas, ctx;
  let cellSize, boardX, boardY;
  let grid = [];
  let score = 0, level = 1, moves = 30, combo = 0, maxCombo = 0, totalMatches = 0;
  let targetScore = 500;
  let selected = null;
  let animating = false;
  let swapping = false;
  let fallingPieces = [];
  let matchedCells = [];
  let tipTimer = null;

  // Touch/Mouse state
  let touchStartX = 0, touchStartY = 0;
  let touchCell = null;

  // ── Initialization ─────────────────────────────────────────────────────
  function start() {
    showScreen('game-screen');
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    score = 0; level = 1; moves = 30; combo = 0; maxCombo = 0; totalMatches = 0;
    targetScore = 500;
    selected = null; animating = false;

    resizeCanvas();
    initGrid();
    removeInitialMatches();
    updateHUD();
    render();

    // Show a cyber tip every 20 seconds
    clearInterval(tipTimer);
    tipTimer = setInterval(showCyberTip, 20000);
    setTimeout(showCyberTip, 5000);

    // Events
    canvas.onmousedown = onPointerDown;
    canvas.onmouseup = onPointerUp;
    canvas.ontouchstart = onTouchStart;
    canvas.ontouchend = onTouchEnd;
    window.onresize = () => { resizeCanvas(); render(); };
  }

  function resizeCanvas() {
    const maxW = Math.min(window.innerWidth - 16, 420);
    const maxH = window.innerHeight - 120;
    cellSize = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
    canvas.width = cellSize * COLS;
    canvas.height = cellSize * ROWS;
  }

  function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        grid[r][c] = {
          type: randType(),
          x: c * cellSize,
          y: r * cellSize,
          targetY: r * cellSize,
          alpha: 1,
          scale: 1,
        };
      }
    }
  }

  function randType() {
    // More piece types unlock at higher levels
    const available = Math.min(PIECE_TYPES.length, 4 + Math.floor(level / 3));
    return Math.floor(Math.random() * available);
  }

  function removeInitialMatches() {
    let hasMatches = true;
    while (hasMatches) {
      hasMatches = false;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          // Check horizontal
          if (c >= 2 &&
              grid[r][c].type === grid[r][c-1].type &&
              grid[r][c].type === grid[r][c-2].type) {
            grid[r][c].type = randType();
            hasMatches = true;
          }
          // Check vertical
          if (r >= 2 &&
              grid[r][c].type === grid[r-1][c].type &&
              grid[r][c].type === grid[r-2][c].type) {
            grid[r][c].type = randType();
            hasMatches = true;
          }
        }
      }
    }
  }

  // ── Input Handling ─────────────────────────────────────────────────────
  function getCellFromPos(px, py) {
    const rect = canvas.getBoundingClientRect();
    const x = px - rect.left;
    const y = py - rect.top;
    const c = Math.floor(x / cellSize);
    const r = Math.floor(y / cellSize);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
    return null;
  }

  function onPointerDown(e) {
    if (animating) return;
    const cell = getCellFromPos(e.clientX, e.clientY);
    if (!cell) return;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    touchCell = cell;
    selected = cell;
    render();
  }

  function onPointerUp(e) {
    if (animating || !touchCell) return;
    const dx = e.clientX - touchStartX;
    const dy = e.clientY - touchStartY;
    handleSwipe(dx, dy);
  }

  function onTouchStart(e) {
    if (animating) return;
    e.preventDefault();
    const t = e.touches[0];
    const cell = getCellFromPos(t.clientX, t.clientY);
    if (!cell) return;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchCell = cell;
    selected = cell;
    render();
  }

  function onTouchEnd(e) {
    if (animating || !touchCell) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    handleSwipe(dx, dy);
  }

  function handleSwipe(dx, dy) {
    const threshold = cellSize * 0.25;
    let dr = 0, dc = 0;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > threshold) dc = dx > 0 ? 1 : -1;
    } else {
      if (Math.abs(dy) > threshold) dr = dy > 0 ? 1 : -1;
    }

    if (dr === 0 && dc === 0) { touchCell = null; return; }

    const tr = touchCell.r + dr;
    const tc = touchCell.c + dc;
    if (tr < 0 || tr >= ROWS || tc < 0 || tc >= COLS) { touchCell = null; return; }

    trySwap(touchCell.r, touchCell.c, tr, tc);
    touchCell = null;
  }

  // ── Swap & Match Logic ─────────────────────────────────────────────────
  function trySwap(r1, c1, r2, c2) {
    animating = true;
    combo = 0;

    // Swap
    const tmp = grid[r1][c1].type;
    grid[r1][c1].type = grid[r2][c2].type;
    grid[r2][c2].type = tmp;

    // Check if this creates a match
    const matches = findMatches();
    if (matches.length === 0) {
      // Swap back
      grid[r2][c2].type = grid[r1][c1].type;
      grid[r1][c1].type = tmp;
      animating = false;
      shakeAnimation(r1, c1, r2, c2);
      return;
    }

    moves--;
    updateHUD();

    // Process cascading matches
    processMatches(matches);
  }

  function findMatches() {
    const matched = new Set();

    // Horizontal
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 2; c++) {
        const t = grid[r][c].type;
        if (t === grid[r][c+1].type && t === grid[r][c+2].type) {
          matched.add(`${r},${c}`);
          matched.add(`${r},${c+1}`);
          matched.add(`${r},${c+2}`);
          // Check for 4+ in a row
          let ext = c + 3;
          while (ext < COLS && grid[r][ext].type === t) {
            matched.add(`${r},${ext}`);
            ext++;
          }
        }
      }
    }

    // Vertical
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS - 2; r++) {
        const t = grid[r][c].type;
        if (t === grid[r+1][c].type && t === grid[r+2][c].type) {
          matched.add(`${r},${c}`);
          matched.add(`${r+1},${c}`);
          matched.add(`${r+2},${c}`);
          let ext = r + 3;
          while (ext < ROWS && grid[ext][c].type === t) {
            matched.add(`${ext},${c}`);
            ext++;
          }
        }
      }
    }

    return [...matched].map(s => {
      const [r, c] = s.split(',').map(Number);
      return { r, c };
    });
  }

  function processMatches(matches) {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    totalMatches += matches.length;

    // Score: base 10 per piece × combo multiplier × (bonus for 4+)
    const matchBonus = matches.length > 3 ? matches.length * 5 : 0;
    const points = (matches.length * 10 + matchBonus) * combo;
    score += points;

    // Show combo banner
    if (combo >= 2) {
      showBanner(`⚡ ${combo}x COMBO! +${points}`);
    }
    if (matches.length >= 5) {
      showBanner('🛡️ CYBER SHIELD ACTIVATED!');
    }

    updateHUD();

    // Animate matched cells disappearing
    matchedCells = matches.map(m => ({...m, alpha: 1}));
    animateRemoval(() => {
      // Remove matched pieces
      for (const m of matches) {
        grid[m.r][m.c].type = -1;
      }
      // Gravity
      applyGravity();
      // Fill empty spaces
      fillEmpty();
      // Animate falling
      animateFall(() => {
        // Check for cascading matches
        const newMatches = findMatches();
        if (newMatches.length > 0) {
          processMatches(newMatches);
        } else {
          // Cascade done
          checkLevelUp();
          selected = null;
          animating = false;

          if (moves <= 0) {
            endGame();
          }
        }
      });
    });
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let writeRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c].type !== -1) {
          if (writeRow !== r) {
            grid[writeRow][c].type = grid[r][c].type;
            grid[r][c].type = -1;
          }
          writeRow--;
        }
      }
    }
  }

  function fillEmpty() {
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (grid[r][c].type === -1) {
          grid[r][c].type = randType();
          grid[r][c].y = -cellSize * (ROWS - r); // Start above the board
          grid[r][c].targetY = r * cellSize;
        }
      }
    }
  }

  // ── Animations ─────────────────────────────────────────────────────────
  function animateRemoval(callback) {
    let frame = 0;
    const totalFrames = 12;
    function step() {
      frame++;
      for (const m of matchedCells) {
        m.alpha = 1 - (frame / totalFrames);
      }
      render();
      if (frame < totalFrames) {
        requestAnimationFrame(step);
      } else {
        matchedCells = [];
        callback();
      }
    }
    requestAnimationFrame(step);
  }

  function animateFall(callback) {
    let done = false;
    function step() {
      done = true;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];
          const target = r * cellSize;
          if (cell.y < target) {
            cell.y = Math.min(cell.y + cellSize * 0.3, target);
            if (cell.y < target) done = false;
          }
          cell.targetY = target;
        }
      }
      render();
      if (!done) {
        requestAnimationFrame(step);
      } else {
        callback();
      }
    }
    requestAnimationFrame(step);
  }

  function shakeAnimation(r1, c1, r2, c2) {
    let frame = 0;
    const orig1x = c1 * cellSize;
    const orig1y = r1 * cellSize;
    const orig2x = c2 * cellSize;
    const orig2y = r2 * cellSize;
    function step() {
      frame++;
      const offset = Math.sin(frame * 0.8) * (6 - frame * 0.5);
      grid[r1][c1].x = orig1x + offset;
      grid[r2][c2].x = orig2x - offset;
      render();
      if (frame < 10) {
        requestAnimationFrame(step);
      } else {
        grid[r1][c1].x = orig1x;
        grid[r2][c2].x = orig2x;
        render();
      }
    }
    requestAnimationFrame(step);
  }

  // ── Rendering ──────────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Board background
    ctx.fillStyle = 'rgba(15, 21, 56, 0.8)';
    ctx.beginPath();
    ctx.roundRect(0, 0, canvas.width, canvas.height, 12);
    ctx.fill();

    // Grid lines
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
    ctx.lineWidth = 1;
    for (let r = 1; r < ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * cellSize);
      ctx.lineTo(canvas.width, r * cellSize);
      ctx.stroke();
    }
    for (let c = 1; c < COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * cellSize, 0);
      ctx.lineTo(c * cellSize, canvas.height);
      ctx.stroke();
    }

    // Draw pieces
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = grid[r][c];
        if (cell.type < 0) continue;

        const piece = PIECE_TYPES[cell.type];
        const x = c * cellSize;
        const y = cell.y !== undefined ? cell.y : r * cellSize;
        const centerX = x + cellSize / 2;
        const centerY = y + cellSize / 2;

        // Selection highlight
        if (selected && selected.r === r && selected.c === c) {
          ctx.strokeStyle = '#00ff88';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(x + 3, y + 3, cellSize - 6, cellSize - 6, 8);
          ctx.stroke();

          ctx.fillStyle = 'rgba(0, 255, 136, 0.1)';
          ctx.beginPath();
          ctx.roundRect(x + 3, y + 3, cellSize - 6, cellSize - 6, 8);
          ctx.fill();
        }

        // Check if this cell is being removed
        const matchedCell = matchedCells.find(m => m.r === r && m.c === c);
        if (matchedCell) {
          ctx.globalAlpha = matchedCell.alpha;
          // Glow effect on removal
          ctx.fillStyle = piece.color + '40';
          ctx.beginPath();
          ctx.arc(centerX, centerY, cellSize * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw emoji
        const fontSize = Math.floor(cellSize * 0.55);
        ctx.font = `${fontSize}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(piece.emoji, centerX, centerY + 2);

        ctx.globalAlpha = 1;
      }
    }
  }

  // ── Game Logic ─────────────────────────────────────────────────────────
  function checkLevelUp() {
    if (score >= targetScore) {
      level++;
      moves += 10 + Math.floor(level * 1.5);
      targetScore = Math.floor(targetScore * 1.8);
      showBanner(`🚀 LEVEL ${level}!`);

      updateHUD();
    }
  }

  function endGame() {
    clearInterval(tipTimer);
    document.getElementById('cyber-tip').classList.remove('show');

    document.getElementById('final-score').textContent = score.toLocaleString();
    document.getElementById('final-level').textContent = level;
    document.getElementById('final-combo').textContent = maxCombo + 'x';
    document.getElementById('final-matches').textContent = totalMatches;

    // Try submitting score to Telegram
    try {
      if (window.TelegramGameProxy) {
        window.TelegramGameProxy.shareScore();
      }
    } catch (e) {}

    setTimeout(() => showScreen('gameover-screen'), 600);
  }

  // ── UI Helpers ─────────────────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function updateHUD() {
    document.getElementById('hud-score').textContent = score.toLocaleString();
    document.getElementById('hud-level').textContent = level;
    document.getElementById('hud-moves').textContent = moves;
    document.getElementById('hud-combo').textContent = 'x' + Math.max(combo, 1);

    const pct = Math.min(100, (score / targetScore) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function showBanner(text) {
    const el = document.getElementById('bonus-banner');
    el.textContent = text;
    el.classList.remove('show');
    void el.offsetWidth; // reflow
    el.classList.add('show');
  }

  function showCyberTip() {
    const tip = CYBER_TIPS[Math.floor(Math.random() * CYBER_TIPS.length)];
    const el = document.getElementById('cyber-tip');
    document.getElementById('cyber-tip-text').textContent = '🛡️ ' + tip;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 6000);
  }

  // ── Public API ─────────────────────────────────────────────────────────
  return { start };
})();
</script>
</body>
</html>
